name: materialize DEN-1420 on final current main

on:
  push:
    branches:
      - agent/den-1420-universal-interop-final-main

permissions:
  contents: read

concurrency:
  group: materialize-den-1420-final-main
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SOURCE_SHA: cf6e14fd18ded08949f9623fbe6836ce4606bfaf
    steps:
      - name: Check out the final current-main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1420-universal-interop-final-main
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Fetch and verify the reviewed semantic composition
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/agent/den-1420-universal-interop-current-main:refs/remotes/source/interop
          test "$(git rev-parse refs/remotes/source/interop)" = "$SOURCE_SHA"

      - name: Apply document 28 without regressing newer main documents
        run: |
          set -euo pipefail
          mkdir -p docs/interop scripts .github/workflows
          for path in \
            docs/28-universal-environment-interop.md \
            docs/interop/compatibility-matrix.json \
            docs/interop/README.md \
            scripts/check_interop_matrix.py \
            .github/workflows/interop-matrix.yml
          do
            git show "$SOURCE_SHA:$path" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          row = (
              "| [28](docs/28-universal-environment-interop.md) | "
              "Flox, Devbox, mise/asdf, and scratch OCI interoperability | "
              "RFC; executable policy validated |\n"
          )
          anchor = (
              "| [27](docs/27-durable-first-install-manifests.md) | "
              "Durable `.zpkg.toml` creation on first dependency install | "
              "implemented; Node + Go/Python/Rust certified on Linux/macOS |\n"
          )
          if row not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("current-main document 27 row was not found exactly once")
              text = text.replace(anchor, anchor + row, 1)
          if "| [29](docs/29-native-dependencies-and-install-hooks.md) |" not in text:
              raise SystemExit("current-main document 29 would be lost")
          if "| [30](docs/30-submodules-zed-packages-and-composition.md) |" not in text:
              raise SystemExit("current-main document 30 would be lost")
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Validate the composed executable contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_interop_matrix.py
          rm -rf scripts/__pycache__
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_interop_matrix.py
          test ! -d scripts/__pycache__
          grep -F '# 28. Universal environment-manager interoperability' \
            docs/28-universal-environment-interop.md
          grep -F '| [28](docs/28-universal-environment-interop.md) |' README.md
          grep -F '| [29](docs/29-native-dependencies-and-install-hooks.md) |' README.md
          grep -F '| [30](docs/30-submodules-zed-packages-and-composition.md) |' README.md
          git diff --check

      - name: Publish only the durable semantic merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-den-1420-final-main.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(DEN-1420): land executable universal interop contract'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/den-1420-universal-interop-final-main
